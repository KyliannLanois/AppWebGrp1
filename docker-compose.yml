services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: touiteur_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:Z
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: touiteur_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: touiteur
      MYSQL_USER: touiteur_user
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: touiteur_pma
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db

volumes:
  db_data: